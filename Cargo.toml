[workspace]
resolver = "2"
members = ["crates/s7", "crates/s7plus", "crates/s7napi"]
exclude = ["fuzz"]

[workspace.package]
version = "1.2.1"
edition = "2021"
license = "LGPL-3.0-only"
authors = ["Oriol Rius"]
repository = "https://github.com/oriolrius/node-red-contrib-s7-rust"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = true
