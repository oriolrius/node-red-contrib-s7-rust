[package]
name = "s7plus"
description = "S7CommPlus (S7-1200/1500) client: symbolic access, TLS 1.3, legitimation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# In-process fake S7-1200/1500 (test support, also for s7napi tests).
fake = ["dep:rcgen"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"
aes = "0.9"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
rcgen = { version = "0.14", optional = true, default-features = false, features = ["ring", "crypto"] }
