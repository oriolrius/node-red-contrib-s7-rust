<script type="text/html" data-help-name="s7rs-endpoint">
  <p>A connection to one Siemens S7 CPU (ISO-on-TCP, port 102). The protocol runs in Rust inside
    the Node-RED process, one thread per connection.</p>
  <h3>Details</h3>
  <h4>Protocol</h4>
  <p><code>S7comm</code> is the classic protocol: all S7 families and LOGO!, absolute addresses.
    S7-1200/1500 need PUT/GET access enabled, and the DBs must be not optimized.</p>
  <p><code>S7CommPlus</code> is the S7-1200/1500 protocol: symbolic access to optimized DBs
    (<code>"DB_Opt".mat[1,2]</code>), PLC tag names (<code>Test_Int</code>), absolute I/Q/M/DB
    addresses too, optional TLS and password (legitimation).</p>
  <h4>Classic connection</h4>
  <p>Rack, slot and link type come from the CPU family when they are empty
    (S7-300: slot 2; S7-1200/1500: slot 1). With TSAPs set, rack and slot are not used.</p>
  <p>Gap: tags in the same area and DB that are closer than N bytes are read as one block.</p>
  <h4>S7CommPlus</h4>
  <p>Symbols are resolved once per session (a reconnect resolves them again). The password is
    stored as a Node-RED credential.</p>
  <h4>PLC certificate (TLS)</h4>
  <p>Without a check, TLS protects only against passive capture: a device between Node-RED and
    the PLC can show its own certificate. Set one of these checks:</p>
  <ul>
    <li><b>pinned fingerprint</b>: the SHA-256 of the PLC certificate. More fingerprints,
      separated by commas, allow a change of the certificate.</li>
    <li><b>trusted certificate or project CA</b>: the PLC certificate in PEM (exported from
      TIA Portal: device configuration, Protection &amp; Security, certificate manager), or the
      CA of the project when the project CA signs the PLC certificates. The certificate must be
      valid now and contain the certificate name: by default the host (the S7-1500 puts its IP
      addresses in the certificate). Set the name when Node-RED uses another address (NAT).</li>
  </ul>
  <p><i>Read from the PLC</i> shows the certificate of the deployed endpoint, and
    <i>Use this certificate</i> copies its fingerprint and PEM to the fields. Compare it with the
    certificate in TIA Portal before you trust it. When the check fails, the endpoint stays
    disconnected and the error shows the fingerprint of the certificate it got; <i>Read from the
    PLC</i> then shows the refused certificate with a warning (for example after a new PLC
    certificate).</p>
  <p>Some CPUs accept only TLS sessions (for example PLCSIM Advanced V8, FW S4.1). If the
    connection fails with "the PLC refused the session without TLS", turn on TLS.</p>
  <h4>S7 partner (BSEND/BRCV, USEND/URCV)</h4>
  <p>Data transfer with the PLC instructions <code>BSEND</code> / <code>BRCV</code> (blocks,
    acknowledged) and <code>USEND</code> / <code>URCV</code> (up to four areas, not acknowledged)
    over an S7 connection, for the nodes <code>s7 bsend</code>, <code>s7 brcv</code>,
    <code>s7 usend</code> and <code>s7 urcv</code>. In TIA Portal: add an S7
    connection to an unspecified partner, with the active connection establishment on the partner
    side (not on the PLC), and use its ID in the instructions. Node-RED connects to the PLC with the
    TSAPs of that connection: local = the partner TSAP, remote = the PLC TSAP (S7-1500 numeric
    TSAPs: clear "SIMATIC-ACC" in the connection properties). The partner address of the connection
    must be the address the PLC sees for Node-RED. The connection is loaded with the hardware
    configuration.</p>
  <h4>Log</h4>
  <p>Messages go to the Node-RED log. <code>trace</code> logs every frame in hex.</p>
  <h3>References</h3>
  <ul>
    <li><a href="https://github.com/oriolrius/node-red-contrib-s7-rust#readme">README</a> - addresses and types</li>
  </ul>
</script>
