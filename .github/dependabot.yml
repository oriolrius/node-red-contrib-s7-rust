version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']
    ignore:
      # major API changes (napi 3, aes 0.9) need a code migration: do them by hand
      - dependency-name: 'napi*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'aes'
        versions: ['>=0.9']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dev:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
