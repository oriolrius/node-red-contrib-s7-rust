name: Fuzz

# cargo-fuzz (libFuzzer) on the parsers of PLC replies and tag addresses.
# Pull requests and pushes: 60 s per target. Weekly: 10 min per target.

on:
  push:
    branches: [main]
    paths: ['crates/s7/**', 'crates/s7plus/**', 'fuzz/**', '.github/workflows/fuzz.yml']
  pull_request:
    paths: ['crates/s7/**', 'crates/s7plus/**', 'fuzz/**', '.github/workflows/fuzz.yml']
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [s7_reply, s7_tag_value, s7_block_clock, s7plus_pdu, s7plus_value, s7plus_misc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Run ${{ matrix.target }}
        working-directory: fuzz
        env:
          SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '600' || '60' }}
        run: cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 -timeout=10
      - name: Keep the crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
