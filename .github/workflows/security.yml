name: Security

# Secret scanning (gitleaks, GitGuardian), dependency audit (RustSec, npm) and
# dependency review of pull requests. Results go to the job summary; gitleaks
# and GitGuardian fail the job when they find a secret.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comments on the lines of a pull request that contain a secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ggshield:
    name: Secrets (GitGuardian)
    runs-on: ubuntu-latest
    env:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
    steps:
      - name: Check the GitGuardian API key
        if: env.GITGUARDIAN_API_KEY == ''
        run: |
          echo "::warning::GitGuardian scan skipped. Add the repository secret GITGUARDIAN_API_KEY (scope scan)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.GITGUARDIAN_API_KEY != ''
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: GitGuardian/ggshield-action@5cc1ed2be3e8bf625d354c7170731880670f74de # v1.56.1
        if: env.GITGUARDIAN_API_KEY != ''
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  audit:
    name: Dependency audit (RustSec, npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo audit (RustSec advisory database)
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny warnings
      - name: npm audit (runtime dependencies of the published package)
        run: npm audit --omit=dev --audit-level=low

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
