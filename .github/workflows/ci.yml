name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features s7plus/fake,s7/fakecpu,s7napi/fake -- -D warnings
      - run: cargo test --workspace --features s7plus/fake

  node-red:
    name: Node-RED ${{ matrix.node-red }} on Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: '20', node-red: '4', module: node-red-4 }
          - { node: '22', node-red: '4', module: node-red-4 }
          - { node: '22', node-red: '5', module: node-red }
          - { node: '24', node-red: '5', module: node-red }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # both Node-RED majors are in package-lock.json (node-red, and the alias node-red-4)
      - run: npm ci
      - name: Node-RED version under test
        run: node -p "require('${{ matrix.module }}/package.json').version"
      - run: npm run test:node
        env:
          S7RS_NODE_RED: ${{ matrix.module }}

  package:
    name: Package (glibc 2.28 + musl binaries, smoke tests, scorecard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: pip install --require-hashes --no-deps -r .github/requirements/zigbuild.txt
      - run: npm run build:release
      - name: Smoke test in glibc and musl containers
        run: |
          for img in node:18-buster node:22-bookworm-slim node:24-alpine nodered/node-red:latest; do
            docker run --rm --entrypoint node -v "$PWD":/p:ro -w /p "$img" scripts/smoke.js
          done
      - run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: '*.tgz'
      - name: Node-RED scorecard (node-red-dev validate)
        continue-on-error: true
        run: npx --yes node-red-dev@0.1.6 validate -p .
